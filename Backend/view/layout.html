<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Dropdown</title>
    <style>
        /* Navbar Container */
        nav {
            background-color: #333;
            padding: 10px 20px;
        }

        /* Menu List */
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* Menu Item */
        nav ul li {
            position: relative;
            margin-right: 20px;
        }

        /* Link Style */
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            display: block;
        }

        nav ul li a:hover {
            background-color: #555;
            border-radius: 4px;
        }

        /* Thêm icon ▼ cho menu có children */
        nav ul li.has-children > a::after {
            content: " ▼";
            font-size: 0.6rem;
        }

        /* Dropdown Menu */
        nav ul li ul {
            display: none;
            position: absolute;
            background-color: #333;
            top: 40px;
            left: 0;
            min-width: 160px;
            border-radius: 4px;
            z-index: 1;
        }

        /* Hover thì xổ xuống */
        nav ul li:hover ul {
            display: block;
        }
    </style>
</head>
<body>
    <script src="main.js"></script>
    <div id="main"></div>
</body>
</html>
